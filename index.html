.secret-text{

/* ================= STARS LAYER ================= */

.stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:-50%;
    background-repeat:repeat;
}

.stars::before{

    background-image:
        radial-gradient(2px 2px at 20px 30px,#fff,transparent),
        radial-gradient(2px 2px at 40px 70px,#fff,transparent),
        radial-gradient(1px 1px at 90px 40px,#fff,transparent),
        radial-gradient(2px 2px at 130px 80px,#fff,transparent),
        radial-gradient(1px 1px at 160px 20px,#fff,transparent),
        radial-gradient(2px 2px at 200px 120px,#fff,transparent);

    background-size:250px 250px;

    animation:starMove1 120s linear infinite;
    opacity:.7;
}

.stars::after{

    background-image:
        radial-gradient(2px 2px at 50px 50px,#fff,transparent),
        radial-gradient(1px 1px at 120px 100px,#fff,transparent),
        radial-gradient(2px 2px at 170px 60px,#fff,transparent),
        radial-gradient(1px 1px at 220px 150px,#fff,transparent);

    background-size:300px 300px;

    animation:starMove2 180s linear infinite;
    opacity:.4;
}

@keyframes starMove1{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(250px);
    }
}

@keyframes starMove2{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-300px);
    }
}
.stars::before{
    animation:
        starMove1 120s linear infinite,
        twinkle 2s ease-in-out infinite alternate;
}

.stars::after{
    animation:
        starMove2 180s linear infinite,
        twinkle 3s ease-in-out infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.2;
    }
    to{
        opacity:.9;
    }
}

function resizePersonCanvas() {

const personParticles = [];

function createPersonParticles() {

    const personElement = document.getElementById("person");
    const personText = personElement.innerText.trim();

    const offscreen = document.createElement("canvas");
    offscreen.width = personCanvas.width;
    offscreen.height = personCanvas.height;

    const octx = offscreen.getContext("2d");

    octx.clearRect(0, 0, offscreen.width, offscreen.height);

    const computedStyle = getComputedStyle(personElement);

    const fontSize =
        parseInt(computedStyle.fontSize) || 80;

    const fontFamily =
        computedStyle.fontFamily || "Arial";

    const fontWeight =
        computedStyle.fontWeight || "bold";

    octx.fillStyle = "#ffffff";
    octx.textAlign = "center";
    octx.textBaseline = "middle";

    octx.font =
        `${fontWeight} ${fontSize}px ${fontFamily}`;

    // CHARACTER SPACING
    const letterSpacing = 85;

    const totalWidth =
        personText.length * letterSpacing;

    let startX =
        (offscreen.width / 2) -
        (totalWidth / 2);

    const centerY =
        offscreen.height / 2 + 120;

    for (let i = 0; i < personText.length; i++) {

        octx.fillText(
            personText[i],
            startX + (i * letterSpacing),
            centerY
        );
    }

    const imageData = octx.getImageData(
        0,
        0,
        offscreen.width,
        offscreen.height
    );

    const data = imageData.data;

    const colors = [
        "#ff4d4d",
        "#ff9f43",
        "#feca57",
        "#1dd1a1",
        "#48dbfb",
        "#54a0ff",
        "#5f27cd",
        "#ff6bcb",
        "#ffffff"
    ];

    for (let y = 0; y < offscreen.height; y += 4) {

        for (let x = 0; x < offscreen.width; x += 4) {

            const index =
                (y * offscreen.width + x) * 4;

            if (data[index + 3] > 150) {

                const particle = {

                    x: personCanvas.width / 2,
                    y: personCanvas.height / 2,

                    targetX: x,
                    targetY: y,

                    size: 2.4 + Math.random() * 1.5,

                    color:
                        colors[
                            Math.floor(
                                Math.random() *
                                colors.length
                            )
                        ]
                };

                personParticles.push(particle);

                anime({
                    targets: particle,

                    x: x,
                    y: y,

                    duration:
                        3500 +
                        Math.random() * 1200,

                    delay:
                        Math.random() * 700,

                    easing: "easeOutQuart"
                });
            }
        }
    }

    setTimeout(() => {

        anime({

            targets: personParticles,

            x: function(el) {
                return (
                    el.targetX +
                    anime.random(-4, 4)
                );
            },

            y: function(el) {
                return (
                    el.targetY +
                    anime.random(-4, 4)
                );
            },

            duration: 4000,

            easing: "easeInOutSine",

            direction: "alternate",

            loop: true
        });

    }, 4200);
}

function drawPersonParticles() {

    pctx.clearRect(
        0,
        0,
        personCanvas.width,
        personCanvas.height
    );

    personParticles.forEach(p => {

        pctx.beginPath();

        pctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        // Fill
        pctx.fillStyle = p.color;
        pctx.fill();

        // Small border
        pctx.lineWidth = 0.8;
        pctx.strokeStyle = "#000";
        pctx.stroke();
    });

    requestAnimationFrame(
        drawPersonParticles
    );
}

document.getElementById('gift').onclick = () => {

    const x = canvas.width / 2;
    const y = canvas.height / 2;

    const gift = new Particle(
        x,
        y,
        0,
        0,
        '',
        20,
        'emoji',
        '🎁'
    );

    gift.opened = false;
    gift.life = 1;

    gift.update = function () {

        // keep fixed at center
        this.x = x;
        this.y = y;

        if (!this.opened) {

            this.opened = true;

            const emojis = ['🎉','✨','💥','🎊','🎈','🎁'];

            for (let i = 0; i < 80; i++) {

                const angle = Math.random() * Math.PI * 2;
                const speed = rand(2, 6);

                const p = new Particle(
                    x,
                    y,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    '',
                    10,
                    'emoji',
                    emojis[Math.floor(Math.random() * emojis.length)]
                );

                p.update = function () {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.05;
                    this.life -= 0.01;
                };

                particles.push(p);
            }

            // ✅ REMOVE GIFT AFTER EXPLOSION
            this.life = 0;
        }
    };

    gift.draw = function () {
        ctx.save();
        ctx.font = `${this.size * 4}px Arial`;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    };

    particles.push(gift);
};

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resize();
addEventListener('resize',resize);

let particles=[];

function rand(min,max){
    return Math.random()*(max-min)+min;
}

class Particle{
    constructor(x,y,vx,vy,color,size,type='circle',text=''){
        this.x=x;
        this.y=y;
        this.vx=vx;
        this.vy=vy;
        this.color=color;
        this.size=size;
        this.type=type;
        this.text=text;
        this.life=1;
    }

    update(){
        this.x+=this.vx;
        this.y+=this.vy;
        this.vy+=0.03;
        this.life-=0.008;
    }

    draw(){

        ctx.save();
        ctx.globalAlpha=Math.max(this.life,0);

        if(this.type==='circle'){

            ctx.fillStyle=this.color;
            ctx.shadowBlur=15;
            ctx.shadowColor=this.color;

            ctx.beginPath();
            ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
            ctx.fill();

        }else{

            ctx.font=`${this.size*4}px Arial`;
            ctx.fillStyle=this.color || '#fff';
            ctx.shadowBlur=10;
            ctx.shadowColor=this.color || '#fff';
            ctx.fillText(this.text,this.x,this.y);

        }

        ctx.restore();
    }
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles=particles.filter(p=>p.life>0);

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

animate();

document.getElementById('fireworks').onclick=()=>{

    let bursts=0;

    const timer=setInterval(()=>{

        const x=rand(100,canvas.width-100);
        const y=rand(80,canvas.height*0.45);

        const colors=[
            '#ff0000',
            '#ffff00',
            '#00ff00',
            '#00ffff',
            '#0000ff',
            '#ff00ff',
            '#ff8800',
            '#ffffff'
        ];

        for(let i=0;i<180;i++){

            const angle=Math.random()*Math.PI*2;
            const speed=rand(2,8);

            particles.push(
                new Particle(
                    x,
                    y,
                    Math.cos(angle)*speed,
                    Math.sin(angle)*speed,
                    colors[Math.floor(Math.random()*colors.length)],
                    3
                )
            );
        }

        bursts++;

        if(bursts>=12){
            clearInterval(timer);
        }

    },350);

};

document.getElementById('smiles').onclick=()=>{

    const emojis=['😊','😍','😂','🥳','🤩'];

    for(let i=0;i<120;i++){

        const p=new Particle(
            rand(0,canvas.width),
            canvas.height+rand(0,200),
            rand(-1,1),
            rand(-6,-2),
            '#ffffff',
            5, /* smaller smileys */
            'emoji',
            emojis[Math.floor(Math.random()*emojis.length)]
        );

        p.update=function(){
            this.x+=this.vx;
            this.y+=this.vy;
            this.life-=0.004;
        };

        particles.push(p);
    }
};

document.getElementById('hearts').onclick=()=>{

    const heartColors=[
        '#ff0000', // red
        '#ff69b4', // pink
        '#ff9900', // orange
        '#ffff00', // yellow
        '#00cc44', // green
        '#0099ff', // blue
        '#9933ff'  // purple
    ];

    for(let i=0;i<180;i++){

        const color=
            heartColors[
                Math.floor(
                    Math.random()*heartColors.length
                )
            ];

        const p=new Particle(
            rand(0,canvas.width),
            canvas.height+rand(0,200),
            rand(-1.5,1.5),
            rand(-7,-2),
            color,
            8,
            'emoji',
            '❤'
        );

        p.update=function(){

            this.x+=this.vx;
            this.y+=this.vy;
            this.life-=0.004;

        };

        p.draw=function(){

    ctx.save();
    ctx.globalAlpha=Math.max(this.life,0);

    ctx.font = `${this.size * 4}px Arial`;

    // border (outline)
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#000000'; // black border (you can change)
    ctx.strokeText(this.text, this.x, this.y);

    // fill heart
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fillText(this.text, this.x, this.y);

    ctx.restore();
};

        particles.push(p);
    }
};
}
</script>
